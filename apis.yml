description: >-
  dkmedtech (Suzhou Dingke Medical Technology Co., Ltd.) is a medical device
  manufacturer founded in 2010 in Suzhou, Jiangsu Province, China, developing
  interventional vascular devices across three areas: peripheral vascular
  intervention, cardiovascular intervention, and neurovascular intervention.
  With a team of 100+ and a global manufacturing center launched in December
  2025, its products carry NMPA (China), CE (Europe), and FDA (United States)
  regulatory clearances. Backed by Qiming Venture Partners, the company was
  added to the API Evangelist network as a portfolio-lead stub; it publishes a
  corporate website but no developer API, documentation, or machine-readable
  API surface at this time.
